[project]
name = "discord-ai-assistant"
version = "0.6.1"
description = "Private Discord music assistant with optional Gemini tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiohttp>=3.12,<4",
  "discord.py[voice]>=2.5,<3",
  "discord-ext-voice-recv @ git+https://github.com/rdphillips7/discord-ext-voice-recv.git@ddd28601fe556f585b869e215f29c8236b95f88f",
  "faster-whisper>=1.2,<2",
  "google-genai>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
meeting = [
  "SoundCard>=0.4,<1",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
  "Pillow>=10,<13",
  "dxcam>=0.3,<1; platform_system == 'Windows'",
]
capture-build = [
  "pyinstaller>=6,<7",
]
tts-local = [
  "kokoro>=0.9.4,<1",
  "misaki[zh]>=0.9.4,<1",
  "soundfile>=0.13,<1",
]

[project.scripts]
discord-ai-assistant = "discord_ai_assistant.main:main"
moxue-capture-agent = "discord_ai_assistant.capture_agent.cli:main"
moxue-tts-worker = "discord_ai_assistant.voice.worker_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
